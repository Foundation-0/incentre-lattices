name: verify

# Reruns every verifier on three Python versions and fails if any regenerated certificate differs
# from the committed one or was never committed. Finite checks only: a green run means the recorded
# computations replay, not that any statement beyond them is proved (see docs/audit.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  verify:
    name: make verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned by commit SHA, because a tag can be moved; .github/dependabot.yml proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes; keeps the job token out of .git/config

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The check in commitment/README.md, run on the checkout as committed: make verify regenerates
      # a certificate that is missing from the commit, so its own hash checks cannot see the gap.
      - name: Committed files match the commitment
        run: python tools/sha256check.py commitment/SHA256SUMS

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      # Slow targets: verify-fold3d (about 1 minute) and verify-fold-cp (about 3 minutes).
      - name: Run every verifier
        run: make verify

      - name: Regenerated certificates must equal the committed ones
        run: git diff --exit-code -- results certificates commitment

      # git diff ignores untracked files, so it misses a regenerated certificate that was never committed.
      - name: No untracked or modified outputs
        run: |
          changes=$(git status --porcelain --untracked-files=all -- results certificates commitment)
          if [ -n "$changes" ]; then
            echo "make verify left files under results/, certificates/ or commitment/ that differ from the commit or are not in it:"
            echo "$changes"
            exit 1
          fi
